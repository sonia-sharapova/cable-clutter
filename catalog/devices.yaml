# Device models and their ports. A port's end is the connector ON THE DEVICE
# (sockets are "f"; a figure-8 power inlet is "iec-c7:m"); a cable fits when
# its end has the same connector and the opposite gender. `qty` is how many
# identical ports there are. Power ports carry `volts` so a wrong-voltage
# adaptor is never suggested. `confirmed: false` marks port lists that rest
# on an assumption about the exact model; `assumption` says which.
# `out_only` lists signals that only leave a two-way port (a laptop's USB-C
# port sends video but doesn't take it in).
devices:
  - id: mac-mini-m2-2023
    name: "Mac mini (M2, 2023)"
    aliases: [mac mini, mac mini m2]
    confirmed: true
    ports:
      - {label: Thunderbolt 4, end: "usb-c:f", qty: 2, dir: both, signals: [usb4, usb.3.0, usb.2.0, video.displayport, video.hdmi, power.usb], out_only: [video.displayport, video.hdmi]}
      - {label: USB-A, end: "usb-a:f", qty: 2, dir: both, signals: [usb.3.0, usb.2.0, power.usb]}
      - {label: HDMI, end: "hdmi:f", dir: out, signals: [video.hdmi]}
      - {label: Ethernet, end: "rj45:f", dir: both, signals: [net.ethernet]}
      - {label: Headphone, end: "trs-3.5:f", dir: out, signals: [audio.analog.stereo]}
      - {label: Power, end: "iec-c7:m", dir: in, signals: [power.ac]}

  - id: macbook-pro-13-m1-2020
    name: "MacBook Pro 13-inch (M1, 2020)"
