# Outline glyphs for `cbl show`. Keys are connector IDs, "family:<name>" as a
# fallback for a whole family, and "default" for anything else. In the art,
# '#' is the contact area: drawn with `fill` on a male end, left blank on a
# female end (a socket). A glyph whose socket looks nothing like its plug
# (a headphone jack) adds `female` art. Plain ASCII only; 14 columns at most.
glyphs:
  default:
    fill: "="
    art: |2
      .--------.
      | ###### |
      '--------'

  # USB and Apple
  usb-a:
    fill: "="
    art: |2
      .----------.
      | ######## |
      '----------'
  usb-a-3.0:
    fill: "="
    art: |2
      .----------.
      |SS######  |
      '----------'
  usb-b:
    fill: "="
    art: |2
       .-----.
      / ##### \
      |_______|
  usb-b-3.0:
    fill: "="
    art: |2
       .-------.
      / ##SS### \
      |_________|
  usb-c:
    fill: "="
    art: |2
      .--------.
      ( ###### )
      '--------'
  micro-usb:
    fill: "="
    art: |2
      .------.
       \####/
        '--'
  micro-usb-3.0:
    fill: "="
    art: |2
      .------.-----.
       \####/ \###/
        '--'   '-'
  mini-usb:
