name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Compiled catalog is current
        run: |
          go generate ./...
          git diff --exit-code catalog/catalog.bin

      - name: Tests (including the performance budgets in internal/perf)
        run: go test ./...

      - name: Budget report
        run: go test -v -run TestBudgets ./internal/perf
